name: CI

# Garde-fou minimal mais bloquant. Objectif : qu'un bug de la famille « Le Pen 0/17 »
# — identifiants de candidats désalignés, clés de positions orphelines, couverture qui
# tombe silencieusement à zéro — ne puisse plus atteindre la production sans être vu.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` échoue si package.json et package-lock.json divergent : c'est voulu.
      - name: Installer les dépendances (verrouillées)
        run: npm ci

      # En premier, et bloquant : c'est la seule étape qui attrape un identifiant utilisé
      # sans import. Ce défaut compile sans erreur et ne se manifeste qu'au rendu — il a
      # laissé /france et /figures entièrement blanches avec une suite de tests verte.
      # Voir docs/remediation/decisions.md D-34.
      - name: Identifiants non définis (no-undef)
        run: npm run check:undef

      - name: Conventions d'échelle des profils politiques
        run: npm run check:conventions

      - name: Marque (« Poliscop » sans e)
        run: npm run check:brand

      - name: Contenu de la rubrique « J'y connais rien »
        run: npm run check:learn

      # Bloquant : intégrité des données, invariants des moteurs, parcours de session,
      # terminologie affichée.
      - name: Tests
        run: npm test

      # Migrations Supabase testées sur un vrai Postgres jetable — aucune connexion à la
      # production, aucun secret requis. Couvre anon / connecté non-admin / analyste /
      # fondateur, l'idempotence et le rollback.
      - name: Tests de migration (Postgres jetable)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql postgresql-client
          export PATH="/usr/lib/postgresql/$(ls /usr/lib/postgresql | sort -V | tail -1)/bin:$PATH"
          ./supabase/tests/run-migration-tests.sh

      - name: Build de production
        run: npm run build

      # Non bloquant : signale les faits datés à revérifier, sans casser la CI pour autant.
      - name: Fraîcheur factuelle (informatif)
        run: npm run check:freshness || true
        continue-on-error: true

      - name: Lint éditorial des questions (informatif)
        run: npm run check:questions || true
        continue-on-error: true

      # Le PIN fondateur avait été livré en clair dans le bundle pendant des mois.
      # Ce contrôle empêche qu'un secret réapparaisse dans les artefacts publiés.
      - name: Aucun secret dans le bundle publié
        run: |
          set -euo pipefail
          PATTERNS='poliscop2027|service_role|SUPABASE_SERVICE|BEGIN [A-Z ]*PRIVATE KEY|sk_live_'
          if grep -rEl "$PATTERNS" dist/ ; then
            echo "::error::Un secret ou un mot de passe apparaît dans le bundle de production."
            exit 1
          fi
          echo "OK — aucun motif de secret détecté dans dist/."
